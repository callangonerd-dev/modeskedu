<style>

.hero{background:linear-gradient(120deg,#082b57,#0b3d7a 60%,#1d5fae);color:#fff;border-radius:20px;padding:26px 28px;margin-bottom:16px;position:relative;overflow:hidden}

.p-ok{background:#dcfce7;color:#166534}.p-warn{background:#fef3c7;color:#92400e}.p-bad{background:#fee2e2;color:#991b1b}.p-info{background:#dbeafe;color:#1e40af}
.modal{position:fixed;inset:0;background:rgba(6,20,40,.55);backdrop-filter:blur(3px);display:none;place-items:center;z-index:50;padding:20px}.modal.on{display:grid}
.mbox{background:#fff;border-radius:22px;padding:0;width:min(780px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.mbox>h2{background:linear-gradient(120deg,#082b57,#1559a8);color:#fff;padding:18px 24px;font-size:18px;font-weight:800}
.mbox>.form,.mbox>#warn,.mbox>.bar{margin-left:24px;margin-right:24px}.mbox>.bar{margin-bottom:22px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:20px 0}.form label{font-size:11px;font-weight:800;color:var(--mut);display:grid;gap:6px;text-transform:uppercase;letter-spacing:.4px}.form .full{grid-column:1/-1}

.occ td,.occ th{min-width:86px;border:1px solid var(--line);text-align:center;font-size:12px}.occ td.room{text-align:left;font-weight:700;background:#f4f8fd;white-space:nowrap}

.impw{padding:6px 24px 4px}.imp-sec{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:14px 0}.imp-sec>b{color:var(--pri);font-size:14px}.imp-sec small{display:block;color:var(--mut);margin-top:4px}

.maptbl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:12px 0}.maptbl label{display:grid;gap:4px;font-size:11px;font-weight:800;color:var(--mut);text-transform:uppercase}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}.ck input{width:auto}
.note{background:#eef5ff;border:1px solid #cfe0f7;color:#1e3a8a;border-radius:10px;padding:10px 12px;font-size:13px}
.params{display:grid;gap:8px;margin-top:14px}.params .ph{display:grid;grid-template-columns:170px 1fr;gap:10px;font-size:10px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}.params label{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;font-size:13px;font-weight:700}.params input{padding:7px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

[c.ini,c.fim].forEach(k=>{if(x=g(k)){const m=x.textContent.trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);if(m)x.innerHTML=`<span class="dt">${m[1]} ${MES[+m[2]-1]}<small>${m[3]}</small></span>`}});
if(x=g(c.qtd)){const t=x.textContent.trim();if(t)x.innerHTML=`<span class="qa"><i class="fa-solid fa-users"></i>${t}</span>`}});tb.dataset.dec=tb.rows.length+"|"+tb.textContent.length}
const run=()=>document.querySelectorAll(".tw tbody").forEach(dec);new MutationObserver(()=>{clearTimeout(window.__dt);window.__dt=setTimeout(run,30)}).observe(document.body,{childList:true,subtree:true});run()})()</script><script id="edu-conferencia-estoque">
/* Conferência de requisições, pedidos e RDM — mesmo fluxo do Modesk Estoque:
   lista recolhível, recebimento com data de chegada, código/lote, validade e área por item,
   lançamento automático no estoque com nº da requisição e data de chegada. */
(function(){
const E=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const hoje=()=>new Date().toISOString().slice(0,10);
const IN='style="width:100%"';
const recebida=r=>r.status==="Recebida";
const st=r=>recebida(r)?"Recebida":recSt(r);
const css=document.createElement("style");css.textContent=`
.cf-list{display:grid;gap:10px}.cf-list.grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.cf-card{border:1px solid var(--line,#d9e2ec);border-radius:14px;overflow:hidden;background:var(--card,#fff)}
.cf-head{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
.cf-num{font-weight:800}.cf-sub{flex:1;font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cf-body{padding:0 14px 14px}.cf-body.hid{display:none}.cf-chev{transition:transform .2s;opacity:.5}
.cf-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;opacity:.8;margin:4px 0 10px}
.cf-grid{display:grid;grid-template-columns:.7fr 3fr 1fr 1.4fr 1.4fr 1.4fr;gap:8px;align-items:center}
.cf-grid.h{font-size:11px;text-transform:uppercase;opacity:.6;font-weight:700;margin-bottom:4px}
.cf-rows{display:grid;gap:6px;max-height:44vh;overflow:auto;padding-right:4px}
.cf-ok{display:inline-flex;gap:6px;align-items:center;padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px}
.cf-tg button{padding:6px 10px;border-radius:8px;border:1px solid var(--line,#d9e2ec);background:none;cursor:pointer;color:inherit}.cf-tg button.on{font-weight:800;outline:2px solid currentColor}
`;document.head.appendChild(css);
let vis=localStorage.getItem("edu_conf_vis")||"lista";
window.cfVis=m=>{vis=m;localStorage.setItem("edu_conf_vis",m);render()};
window.cfToggle=(id,b)=>{const e=document.getElementById(id);if(!e)return;e.classList.toggle("hid");const c=b.querySelector(".cf-chev");if(c)c.style.transform=e.classList.contains("hid")?"":"rotate(180deg)"};
window.cfOpen=id=>{RSEL=id;render()};

function lista(){const L=DB.rec||[];if(!L.length)return "";
 return `<div class="card"><div class="bar"><h3 style="margin:0;flex:1"><i class="fa-solid fa-clipboard-check"></i> Conferência de requisições, pedidos e RDM</h3><span style="font-size:12px;opacity:.7">Clique para ver os itens e confirmar o recebimento.</span><span class="cf-tg"><button class="${vis=="lista"?"on":""}" onclick="cfVis('lista')"><i class="fa-solid fa-list"></i></button> <button class="${vis=="grid"?"on":""}" onclick="cfVis('grid')"><i class="fa-solid fa-table-cells-large"></i></button></span></div>
 <div class="cf-list ${vis=="grid"?"grid":""}">${L.map(r=>{const id="cf-"+r.id,tot=r.itens.reduce((a,i)=>a+(+i.qtd||0),0);
 return `<article class="cf-card"><button class="cf-head" onclick="cfToggle('${id}',this)"><span class="cf-num">${E(r.tipo||"Req.")} ${E(r.numero)}</span>${pill(st(r))}<span class="cf-sub">${r.itens.length} item(ns) · ${tot} un.${r.requisitante?" · "+E(r.requisitante):""}</span><i class="fa-solid fa-chevron-down cf-chev"></i></button>
 <div class="cf-body hid" id="${id}"><div class="cf-meta"><span>Importado em: <b>${fmt(r.data)}</b></span>${r.valor?`<span>Valor: <b>${BRL(r.valor)}</b></span>`:""}${r.recebidaEm?`<span>Recebida em: <b>${fmt(r.recebidaEm)}</b></span>`:""}</div>
 <div class="tw"><table><thead><tr><th>Item</th><th>Pedido</th><th>Recebido</th></tr></thead><tbody>${r.itens.map(i=>`<tr><td>${E(i.item)} <small style="opacity:.6">${E(i.unidade||"")}</small></td><td><b>${i.qtd}</b></td><td>${+i.recebido?i.recebido:"—"}</td></tr>`).join("")}</tbody></table></div>
 <div class="bar" style="margin-top:10px">${recebida(r)?`<span class="cf-ok pill p-ok"><i class="fa-solid fa-circle-check"></i> Itens já lançados no estoque</span>`:`<button class="btn" onclick="cfReceber(${r.id})"><i class="fa-solid fa-check"></i>Confirmar recebimento</button>`}<button class="btn g" onclick="cfOpen(${r.id})"><i class="fa-solid fa-pen"></i>Abrir conferência</button><span style="flex:1"></span><button class="btn r" onclick="recDel(${r.id})"><i class="fa-solid fa-trash"></i></button></div></div></article>`}).join("")}</div></div>`}

/* Modal de recebimento */
window.cfReceber=function(id){const r=(DB.rec||[]).find(x=>x.id==id);if(!r)return;
 const areas=[...new Set(["Geral",...DB.est.map(e=>e.estoque).filter(Boolean)])];
 const its=r.itens.map((i,k)=>({i,k})).filter(o=>o.i.tipoItem!="Serviço"&&(+o.i.enviado||0)<o.i.qtd);
 document.getElementById("mbox").innerHTML=`<h2>Recebimento — ${E(r.tipo||"Requisição")} ${E(r.numero)}</h2><div style="padding:14px 26px 0">
 <p style="font-size:13px;opacity:.75;margin:-4px 0 14px">Marque <b>Conferido</b> em cada item que chegou e confira a quantidade. Só os itens conferidos entram no estoque, com o número da requisição e a data de chegada. O que faltar fica pendente para conferir depois.</p>
 <div class="form"><label>Data de chegada<input id="cf-data" type="date" value="${hoje()}"></label><label>Validade padrão (opcional)<input id="cf-val" type="date"></label></div>
 <div class="bar" style="margin:10px 0 0"><button class="btn g" type="button" onclick="document.querySelectorAll('#mbox .cf-k').forEach(c=>c.checked=true)"><i class="fa-solid fa-check-double"></i>Marcar todos como conferidos</button></div><div class="cf-grid h" style="margin-top:10px"><div>Conferido</div><div>Item</div><div>Qtd</div><div>Código / lote</div><div>Validade</div><div>Área / estoque</div></div>
 <div class="cf-rows">${its.map(({i,k})=>`<div class="cf-grid" data-cf="${k}"><input type="checkbox" class="cf-k" style="width:20px;height:20px" title="Conferido"><div style="font-size:13px;font-weight:600">${E(i.item)} <small style="opacity:.6">${E(i.unidade||"")}</small></div>
 <input class="cf-q" type="number" min="0" step="any" value="${Math.max(0,i.qtd-(+i.enviado||0))}" ${IN}>
 <input class="cf-c" value="${E(i.lote||i.codigo||(r.numero+"-"+String(k+1).padStart(2,"0")))}" ${IN}>
 <input class="cf-v" type="date" value="${E(i.validade||"")}" ${IN}>
 <select class="cf-a" ${IN}>${areas.map(a=>`<option>${E(a)}</option>`).join("")}</select></div>`).join("")||"<p>Nada pendente de conferência nesta requisição.</p>"}</div>
 <div id="warn"></div></div><div class="bar" style="justify-content:flex-end;margin-top:16px"><button class="btn g" onclick="closeM()">Cancelar</button><button class="btn" onclick="cfLancar(${r.id})"><i class="fa-solid fa-check"></i>Lançar conferidos no estoque</button></div>`;
 document.getElementById("modal").classList.add("on")};

window.cfLancar=function(id){const r=(DB.rec||[]).find(x=>x.id==id);if(!r)return;
 const ch=document.getElementById("cf-data").value||hoje(),vp=document.getElementById("cf-val").value;
 const rows=[...document.querySelectorAll("#mbox [data-cf]")].filter(b=>b.querySelector(".cf-k").checked).map(b=>({it:r.itens[+b.dataset.cf],q:+b.querySelector(".cf-q").value||0,c:b.querySelector(".cf-c").value.trim(),v:b.querySelector(".cf-v").value||vp,a:b.querySelector(".cf-a").value}));
 if(!rows.length){document.getElementById("warn").innerHTML=`<p class="pill p-bad" style="margin-top:10px">Marque ao menos um item como conferido.</p>`;return}
 const falta=rows.find(o=>o.q>0&&!o.c);if(falta){document.getElementById("warn").innerHTML=`<p class="pill p-bad" style="margin-top:10px">Informe o código/lote de ${E(falta.it.item)}.</p>`;return}
 DB.mov=DB.mov||[];
 rows.forEach(({it,q,c,v,a})=>{it.lote=c;it.validade=v;if(q<=0)return;
  let e=DB.est.find(x=>x.codigo==c&&(x.validade||"")==(v||""))||DB.est.find(x=>!x.validade&&!v&&recNorm(x.item)==recNorm(it.item));
  if(!e){e={id:DB.seq++,tipoItem:it.tipoItem||"Consumo",estoque:a,codigo:c,item:it.item,unidade:it.unidade||"un",qtd:0,minimo:0,validade:v||""};DB.est.push(e)}
  e.qtd=(+e.qtd||0)+q;e.entrada=ch;e.qtdEntrada=q;e.requisicao=r.numero;e.chegouEm=ch;e.recebido=(+e.recebido||0)+q;
  e.obs=((e.obs||"").replace(/\s*· Chegou .*$/,"")+" · Chegou "+fmt(ch)+" pela "+(r.tipo||"requisição")+" "+r.numero).replace(/^ · /,"");
  DB.mov.push({id:DB.seq++,data:ch,tipo:"Entrada",item:e.codigo+" — "+e.item,qtd:q,requisicao:r.numero,status:"Concluído",obs:"Recebimento "+(r.tipo||"RDM EST")+(v?" · validade "+fmt(v):"")});
  it.recebido=Math.max(+it.recebido||0,(+it.enviado||0)+q);it.enviado=(+it.enviado||0)+q});
 const tudo=r.itens.every(i=>i.tipoItem=="Serviço"||(+i.enviado||0)>=i.qtd);r.conferidaEm=new Date().toISOString();
 if(tudo){r.status="Recebida";r.recebidaEm=ch}
 const x=DB.req.find(q=>q.recId==r.id);if(x&&x.status!="Cancelada")x.status=tudo&&MODS.req.f.find(f=>f[0]=="status")[3].includes("Entregue")?"Entregue":recSt(r);
 save();closeM();render();(typeof toast=="function"?toast:alert)((r.tipo||"Requisição")+" "+r.numero+(tudo?" recebida. Os itens conferidos já estão no estoque.":": "+rows.length+" item(ns) conferido(s) lançados no estoque. O restante segue pendente."))};

/* Abre a conferência logo após o upload */
const recStoreAnt=recStore;
window.recStore=recStore=function(){const ok=recStoreAnt.apply(this,arguments);if(ok&&DB.rec&&DB.rec[0])setTimeout(()=>cfReceber(DB.rec[0].id),150);return ok};
/* Página de conferência detalhada: botão de recebimento */
const recPageAnt=recPage;
window.recPage=recPage=function(a){recPageAnt(a);const R=recCur();if(!R)return;const b=a.querySelector(".top .bar");
 if(b)b.insertAdjacentHTML("afterbegin",recebida(R)?`<span class="pill p-ok"><i class="fa-solid fa-circle-check"></i> Recebida em ${fmt(R.recebidaEm)}</span>`:`<button class="btn" onclick="cfReceber(${R.id})"><i class="fa-solid fa-check"></i>Confirmar recebimento</button>`)};

/* Lista recolhível na tela de Requisições */
const renderAnt=render;
window.render=render=function(){renderAnt.apply(this,arguments);
 if(cur=="req"&&!(RSEL&&(DB.rec||[]).some(x=>x.id==RSEL))){const a=document.getElementById("app"),d=a.querySelector(".drop");const h=lista();if(h){if(d)d.insertAdjacentHTML("afterend",h);else a.insertAdjacentHTML("beforeend",h)}}};
render();
})();
</script>
<script id="edu-supabase">
/* ===== INTEGRAÇÃO SUPABASE — sincronização entre dispositivos ===== */
(function(){
const SUPABASE_URL="https://xschfcdeflpuqsucxolu.supabase.co";
const SUPABASE_KEY="sb_publishable_B6syJVvBbUXJr9JKa7VnqA_k7gD1ezr"; /* CHAVE FIXA — manter em todas as versões */ // Supabase > Project Settings > API > anon public (começa com eyJ...) ou Publishable key (sb_publishable_...)
const TABELA="modesk_dados",LINHA=1,POLL_MS=4000;
const ok=/^(eyJ|sb_publishable_)/.test(SUPABASE_KEY);
const H=SUPABASE_KEY.startsWith("eyJ")?{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}:{apikey:SUPABASE_KEY};
const base=SUPABASE_URL+"/rest/v1/"+TABELA;
let timer=null,pushing=false,falhou=false,dirty=false;

const foot=document.querySelector("footer"),badge=document.createElement("span");
badge.style.cssText="font-weight:700;cursor:pointer";badge.title="Clique para sincronizar agora";
foot.insertBefore(badge,foot.children[1]);
function st(t,c){badge.innerHTML='<i class="fa-solid fa-cloud"></i> '+t;badge.style.color=c||"var(--mut)"}
badge.onclick=()=>poll(true);
if(!ok)st("Nuvem não configurada (falta a chave)","#dc2626");else st("Conectando…");

function ensureDB(){
 ["req","est","salas","prog","freq","rio","seg","cursos","mov","rec","rot"].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[]});
 DB.est.forEach(e=>{if(!e.tipoItem)e.tipoItem="Consumo"});
 const m=Object.values(DB).filter(Array.isArray).reduce((a,l)=>l.reduce((b,r)=>r&&+r.id>b?+r.id:b,a),0);
 if(!(DB.seq>m))DB.seq=m+1;
 if(DB.rooms)for(const[f,rs]of Object.entries(DB.rooms))rs.forEach(r=>{if(!ALLROOMS.includes(r)){(ROOMS[f]=ROOMS[f]||[]).push(r);ALLROOMS.push(r)}});
}
const busy=()=>document.getElementById("modal").classList.contains("on")||/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||"");

async function getTs(){
 const r=await fetch(`${base}?id=eq.${LINHA}&select=ts:payload->>_ts`,{headers:H});
 if(!r.ok)throw new Error(r.status+" "+await r.text());
 const d=await r.json();return d.length?{existe:true,ts:+d[0].ts||0}:{existe:false,ts:0}}
async function getPayload(){
 const r=await fetch(`${base}?id=eq.${LINHA}&select=payload`,{headers:H});
 if(!r.ok)throw new Error(r.status);const d=await r.json();return d[0]&&d[0].payload}

async function push(){
 if(!ok)return;if(pushing){dirty=true;return}
 pushing=true;dirty=false;st("Sincronizando…");
 try{DB._ts=DB._ts||Date.now();
  const r=await fetch(`${base}?on_conflict=id`,{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:LINHA,payload:DB})});
  if(!r.ok)throw new Error(r.status+" "+await r.text());
  falhou=false;st("Sincronizado","#16a34a");
 }catch(e){falhou=true;console.error("Erro ao salvar na nuvem:",e);st("Sem conexão — dados salvos só neste aparelho","#d97706")}
 finally{pushing=false;if(dirty){dirty=false;agendar()}}}
function agendar(){clearTimeout(timer);timer=setTimeout(()=>{timer=null;push()},700)}

async function poll(forcar){
 if(!ok||pushing||timer)return;
 if(falhou){return push()}
 try{const r=await getTs();
  if(!r.existe)return push();
  const local=DB._ts||0;
  if(r.ts>local){
   if(busy()&&!forcar)return;
   const p=await getPayload();if(!p||!Object.keys(p).length)return push();
   DB=p;ensureDB();localStorage.setItem(K,JSON.stringify(DB));render();st("Sincronizado","#16a34a");
  }else if(r.ts<local)return push();
  else st("Sincronizado","#16a34a");
 }catch(e){console.error("Erro ao carregar do Supabase (usando dados locais):",e);st("Sem conexão — usando dados locais","#d97706")}}

/* todo save() local passa a enviar para a nuvem */
const saveOriginal=save;
save=function(){DB._ts=Date.now();saveOriginal();if(ok)agendar()};

/* apagar tudo também limpa a nuvem (senão os dados voltariam no próximo sync) */
window.limparDados=async function(){
 if(!confirm("Apagar TODOS os dados do sistema (em todos os dispositivos)? Faça um backup antes."))return;
 if(!confirm("Tem certeza? Esta ação não pode ser desfeita."))return;
 try{if(ok)await fetch(`${base}?on_conflict=id`,{method:"POST",headers:{...H,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:LINHA,payload:{}})})}catch(e){}
 localStorage.removeItem(K);location.reload()};

if(ok){poll();setInterval(poll,POLL_MS);
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
 addEventListener("online",()=>poll(true))}
})();
</script>
